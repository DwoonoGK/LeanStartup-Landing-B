<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>광고 이미지 1 · 알림 중심</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="ad.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="canvas">
    <div class="ad-top">
      <span class="ad-brand"><img src="../assets/logo.png" alt="">말농일지</span>
      <span class="ad-chip"><i data-lucide="gift"></i> 무료 베타</span>
    </div>

    <div class="ad-copy">
      <h1 class="ad-title">옮기기만 하면,<br><em>기록이 농사를</em><br><em>도와줘요</em></h1>
      <p class="ad-sub">방제 시기 알림부터<br>인증 서류 준비까지</p>
    </div>

    <div class="hero__visual stage">
      <div class="phone">
        <div class="phone__screen">
          <div class="app-top">
            <span class="app-brand"><span class="app-brand__mark"><img src="../assets/logo.png" alt=""></span>말농일지</span>
            <span class="app-top__icon"><i data-lucide="calendar-days"></i></span>
          </div>
          <div class="app-notice">
            <span class="app-notice__icon"><i data-lucide="bell-ring"></i></span>
            <div>
              <strong>고추 방제 시기예요</strong>
              <span>지난 기록 기준 · 수확 전 안전 기간 확인 완료</span>
            </div>
          </div>
          <p class="app-label">최근 기록 · 옮기기 완료</p>
          <ul class="app-list">
            <li><span class="app-list__date">6/12</span><span class="app-list__what">고추밭 방제</span><span class="tag tag--green">약제 2통</span></li>
            <li><span class="app-list__date">6/11</span><span class="app-list__what">관수 · 3구역</span><span class="tag tag--amber">물주기</span></li>
            <li><span class="app-list__date">6/10</span><span class="app-list__what">웃거름 주기</span><span class="tag tag--green">비료</span></li>
          </ul>
          <div class="app-actions">
            <span class="app-btn app-btn--primary"><i data-lucide="badge-check"></i>인증 서류로 정리</span>
            <span class="app-btn"><i data-lucide="file-spreadsheet"></i>엑셀</span>
          </div>
        </div>
      </div>
    </div>

    <div class="stamp"><small>베타 테스터</small><strong>무료</strong><span>지금 신청</span></div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
