<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <title>광고 이미지 2 · 인증 서류 중심</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="../assets/styles.css">
  <link rel="stylesheet" href="ad.css">
  <script src="https://unpkg.com/lucide@0.469.0/dist/umd/lucide.min.js"></script>
</head>
<body>
  <div class="canvas">
    <div class="ad-top">
      <span class="ad-brand"><img src="../assets/logo.png" alt="">말농일지</span>
      <span class="ad-chip"><i data-lucide="gift"></i> 무료 베타</span>
    </div>

    <div class="ad-copy">
      <h1 class="ad-title">인증 서류 준비,<br><em>기록으로</em><br><em>덜어 드려요</em></h1>
      <p class="ad-sub">종이·엑셀·앱,<br>쓰던 일지 그대로 옮겨요</p>
    </div>

    <div class="hero__visual stage">
      <div class="phone">
        <div class="phone__screen">
          <div class="app-top">
            <span class="app-brand"><span class="app-brand__mark"><img src="../assets/logo.png" alt=""></span>말농일지</span>
            <span class="app-top__icon"><i data-lucide="file-check"></i></span>
          </div>
          <div class="doc-head">
            <strong>인증 서류 정리</strong>
            <span>올해 기록 기준</span>
          </div>
          <div class="doc-meta"><i data-lucide="circle-check"></i> 필요한 기록이 모두 모였어요</div>
          <ul class="doc-list">
            <li><i data-lucide="circle-check"></i><span>농약 사용 기록</span><span class="tag tag--green">완료</span></li>
            <li><i data-lucide="circle-check"></i><span>비료 사용 기록</span><span class="tag tag--green">완료</span></li>
            <li><i data-lucide="circle-check"></i><span>작업 일지</span><span class="tag tag--green">완료</span></li>
          </ul>
          <div class="app-actions">
            <span class="app-btn app-btn--primary"><i data-lucide="send"></i>인증기관에 제출</span>
            <span class="app-btn"><i data-lucide="printer"></i>인쇄</span>
          </div>
        </div>
      </div>
    </div>

    <div class="stamp"><small>베타 테스터</small><strong>무료</strong><span>지금 신청</span></div>
  </div>
  <script>lucide.createIcons();</script>
</body>
</html>
